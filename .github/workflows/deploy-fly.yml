name: Deploy backend to Fly.io

on:
  push:
    branches: [ main, dev ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to GHCR
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sysrag:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/sysrag:${{ github.ref_name }}

      - name: Deploy to Fly
        uses: superfly/flyctl-actions@v1
        with:
          args: deploy --image ghcr.io/${{ github.repository_owner }}/sysrag:${{ github.sha }} --region fra
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
