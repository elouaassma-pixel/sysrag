name: Deploy backend to Fly.io

on:
  push:
    branches: [ main, dev ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to GHCR
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sysrag:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/sysrag:${{ github.ref_name }}

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly
        run: |
          # If FLY_APP_NAME is set, deploy with -a; otherwise rely on fly.toml in the repo
          if [ -n "${{ secrets.FLY_APP_NAME }}" ]; then
            echo "Using FLY_APP_NAME secret for deploy: ${{ secrets.FLY_APP_NAME }}"
            flyctl deploy -a "${{ secrets.FLY_APP_NAME }}" --image ghcr.io/${{ github.repository_owner }}/sysrag:${{ github.sha }} --regions fra
          else
            echo "FLY_APP_NAME secret not set — falling back to fly.toml (if present)"
            flyctl deploy --image ghcr.io/${{ github.repository_owner }}/sysrag:${{ github.sha }} --regions fra
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
